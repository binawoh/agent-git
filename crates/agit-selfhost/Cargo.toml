[package]
name = "agit-selfhost"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Single-user private AgentGit Hub"
publish = false

[dependencies]
agit = { path = "../..", default-features = false }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
dunce = "1"
fs2 = "0.4"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4"] }
